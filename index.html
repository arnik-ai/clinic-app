/* ── the tour ────────────────────────────────────────────────────────────────────────────────────────────────
   A walk through the business, full screen, in the manner of the Prestige hotel's tour — and it takes two kinds
   of scene, because only some trades have a real 360 photograph in the world:

     { kind: "pano",  src: "pano/hall.jpg" }   a real 360: drag to look round, it wraps, it drifts when idle
     { kind: "photo", src: "img/chairs.jpg" }  the business's own picture, moving slowly across the screen

   Both carry the same doors: a mark that sits in the picture and, tapped, turns towards it and walks into the
   next scene. So every app has a tour today, and the day a business shoots its own 360 the only change is the
   scene's kind and a file in pano/.

   The app supplies TOUR = { title, scenes: {key: {...}}, doors: {key: [{to, at, label}]}, first } where `at` is
   the yaw in degrees for a pano (0 is the middle of the photograph) or an [x%, y%] on a photo.

   No three.js: a panorama is an image panned behind a window, which is what a phone shows anyway, and it keeps
   these demo pages at tens of kilobytes instead of a megabyte. */

function startTour(host, TOUR, onClose) {
  const keys = Object.keys(TOUR.scenes);
  let key = TOUR.first && TOUR.scenes[TOUR.first] ? TOUR.first : keys[0];
  let x = 0, vx = 0, idle = 0, dragging = false, px = 0, walking = false, raf = 0, last = performance.now();

  host.innerHTML = `<div class="t-wrap">
    <div class="t-stage" id="t-stage"></div>
    <i class="t-shade"></i>
    <button class="t-close" type="button" aria-label="بستن">✕</button>
    <div class="t-spots" id="t-spots"></div>
    <div class="t-info"><span class="t-eyebrow">${esc(TOUR.title || "تور مجازی")}</span><b id="t-name"></b><small id="t-line"></small></div>
    <div class="t-chips" id="t-chips"></div>
    <div class="t-hint" id="t-hint">انگشتتان را بکشید، و روی نقطه‌ها بزنید تا جلو بروید</div>
  </div>`;
  const $$ = (s) => host.querySelector(s);
  const stage = $$("#t-stage"), spots = $$("#t-spots"), chips = $$("#t-chips");

  chips.innerHTML = keys.map((k) => `<button type="button" class="t-chip" data-k="${k}">${esc(TOUR.scenes[k].name)}</button>`).join("");

  const scene = () => TOUR.scenes[key];
  const doorsOf = (k) => (TOUR.doors && TOUR.doors[k]) || [];
  const panoWidth = () => stage.clientHeight * 2 * 1.25;   // an equirectangular picture is twice as wide as it is tall

  /** Paint the scene: a panorama is two copies side by side so it can wrap; a photo simply drifts. */
  function paint(fresh) {
    const s = scene();
    if (fresh) {
      stage.className = "t-stage " + (s.kind === "pano" ? "is-pano" : "is-photo");
      stage.innerHTML = s.kind === "pano"
        ? `<div class="t-pan" id="t-pan"><img src="${esc(s.src)}" alt=""><img src="${esc(s.src)}" alt="" aria-hidden="true"></div>`
        : `<img class="t-photo" src="${esc(s.src)}" alt="">`;
      x = s.kind === "pano" ? -((s.at || 0) / 360) * panoWidth() : 0;
      vx = 0;
    }
    $$("#t-name").textContent = s.name;
    $$("#t-line").textContent = s.line || "";
    [...chips.children].forEach((c) => c.classList.toggle("on", c.dataset.k === key));
    spots.innerHTML = doorsOf(key).map((d, i) =>
      `<button class="t-spot" type="button" data-i="${i}"><i></i><span>${esc(d.label)}</span></button>`).join("");
  }

  /** Where each door sits on the screen right now. A pano's door follows the pan and wraps with it. */
  function place() {
    const s = scene(), list = doorsOf(key), w = stage.clientWidth, h = stage.clientHeight;
    [...spots.children].forEach((el, i) => {
      const d = list[i];
      if (!d) return;
      let left, top;
      if (s.kind === "pano") {
        const pw = panoWidth();
        let dx = x + ((d.at || 0) / 360) * pw + pw / 2;
        dx = ((dx % pw) + pw) % pw;                      // the same door, whichever way round you came
        left = dx > w ? dx - pw : dx;
        top = h * (d.y == null ? 0.56 : d.y);
      } else {
        left = w * (d.at[0] / 100);
        top = h * (d.at[1] / 100);
      }
      /* A door out of the frame is not lost: its mark waits on the edge it lies behind, smaller and quieter,
         and tapping it turns the camera there on the way through. */
      const EDGE = 44, inFrame = left > EDGE && left < w - EDGE;
      if (!inFrame) left = Math.max(EDGE, Math.min(w - EDGE, left));
      el.classList.toggle("edge", !inFrame);
      el.style.opacity = walking ? "0" : "1";
      el.style.pointerEvents = walking ? "none" : "auto";
      el.style.transform = `translate(-50%, -50%) translate(${left.toFixed(1)}px, ${top.toFixed(1)}px)`;
    });
  }

  /** Walk through a door: lean towards it, step through, and come to rest in the next scene. */
  function walk(d) {
    if (!d || walking || !TOUR.scenes[d.to]) return;
    walking = true;
    place();
    stage.classList.add("t-go");
    setTimeout(() => {
      key = d.to;
      paint(true);
      stage.classList.remove("t-go");
      stage.classList.add("t-come");
      setTimeout(() => { stage.classList.remove("t-come"); walking = false; idle = 0; }, 520);
    }, 420);
  }

  const show = (k) => { if (TOUR.scenes[k]) { key = k; paint(true); } };

  // a finger turns a panorama; a photo just watches
  const at = (e) => (e.touches ? e.touches[0] : e);
  const down = (e) => { if (walking || scene().kind !== "pano") return; dragging = true; px = at(e).clientX; vx = 0; idle = 0; };
  const move = (e) => {
    if (!dragging) return;
    const p = at(e).clientX;
    vx = p - px; x += vx; px = p; idle = 0;
    if (e.cancelable) e.preventDefault();
  };
  const up = () => { dragging = false; };
  host.addEventListener("pointerdown", down);
  addEventListener("pointermove", move, { passive: false });
  addEventListener("pointerup", up);
  host.addEventListener("touchstart", down, { passive: true });
  host.addEventListener("touchmove", move, { passive: false });
  addEventListener("touchend", up);

  host.addEventListener("click", (e) => {
    const spot = e.target.closest(".t-spot");
    if (spot) return walk(doorsOf(key)[Number(spot.dataset.i)]);
    const chip = e.target.closest(".t-chip");
    if (chip) return show(chip.dataset.k);
    if (e.target.closest(".t-close")) return stop();
  });

  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (scene().kind === "pano") {
      if (!dragging) {
        x += vx; vx *= 0.92;
        if (Math.abs(vx) < 0.05) vx = 0;
        idle += dt;
        if (idle > 2.5 && !vx && !walking) x -= dt * 14;     // nobody is touching it: drift, slowly
      }
      const pw = panoWidth();
      x = ((x % pw) + pw) % pw - pw;                          // keep the two copies covering the window
      const pan = $$("#t-pan");
      if (pan) pan.style.transform = `translateX(${x.toFixed(1)}px)`;
    }
    place();
  }

  function stop() {
    cancelAnimationFrame(raf);
    removeEventListener("pointermove", move);
    removeEventListener("pointerup", up);
    removeEventListener("touchend", up);
    host.innerHTML = "";
    host.classList.remove("t-on");
    if (onClose) onClose();
  }

  host.classList.add("t-on");
  paint(true);
  raf = requestAnimationFrame(frame);
  setTimeout(() => { const h = $$("#t-hint"); if (h) h.classList.add("gone"); }, 4200);
  return { stop, show };
}
/* ── the owner's dashboard ───────────────────────────────────────────────────────────────────────────────────
   What a business owner has never been able to see: how many people opened the app today, what they looked at,
   and — the one that sells it — where they turned back. Full screen over the app, in the house's manner.

   2026 practice, and the reason it looks the way it does: one accent and no colour-per-tile (that pattern now
   reads as dated), a hairline instead of a shadow, dense but readable on a phone, and motion that explains
   rather than decorates — every number counts up to its value and every bar grows from nothing, once, when the
   dashboard opens, so the eye follows the shape of the day.

   The app supplies DASH = { title, today: [[n, label, suffix?]], week: [7 numbers], funnel: [[label, n]],
   top: [[label, n]], note }. In the demos the numbers are a believable sample; on the platform they come from
   the server. */

function startDash(host, DASH, onClose) {
  const fa = (n) => String(n).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
  const WEEK = ["ش", "ی", "د", "س", "چ", "پ", "ج"];
  const max = Math.max(1, ...DASH.week);
  const topMax = Math.max(1, ...DASH.top.map((t) => t[1]));
  const first = DASH.funnel[0][1] || 1;

  host.innerHTML = `<div class="d-wrap">
    <div class="d-bar"><button class="d-close" type="button" aria-label="بستن">✕</button>
      <div><span class="d-eyebrow">dashboard</span><b>${esc(DASH.title)}</b></div></div>
    <div class="d-scroll">
      <div class="d-stats">${DASH.today.map(([n, t, suf]) =>
        `<div class="d-stat"><b data-to="${n}">۰</b><i>${esc(suf || "")}</i><small>${esc(t)}</small></div>`).join("")}</div>

      <div class="d-card">
        <div class="d-h"><b>هفت روز گذشته</b><small>بازدید روزانه</small></div>
        <div class="d-week">${DASH.week.map((v, i) =>
          `<div class="d-col"><span class="d-bar-v" style="--h:${Math.round(v / max * 100)}%;--i:${i}"><em>${fa(v)}</em></span><small>${WEEK[i]}</small></div>`).join("")}</div>
      </div>

      <div class="d-card">
        <div class="d-h"><b>مسیر مشتری</b><small>از باز کردن تا سفارش</small></div>
        <div class="d-funnel">${DASH.funnel.map(([t, n], i) => {
          const pc = Math.round(n / first * 100);
          const drop = i ? DASH.funnel[i - 1][1] - n : 0;
          return `<div class="d-step" style="--i:${i}"><span class="d-fill" style="--w:${pc}%"></span>
            <span class="d-txt"><b>${esc(t)}</b><small>${fa(n)} نفر · ${fa(pc)}٪</small></span>
            ${drop ? `<span class="d-drop">−${fa(drop)}</span>` : ""}</div>`;
        }).join("")}</div>
      </div>

      <div class="d-card">
        <div class="d-h"><b>بیشترین چیزی که دیدند</b><small>این هفته</small></div>
        <div class="d-top">${DASH.top.map(([t, n], i) =>
          `<div class="d-row" style="--i:${i}"><span class="d-name">${esc(t)}</span>
            <span class="d-track"><span class="d-fill2" style="--w:${Math.round(n / topMax * 100)}%"></span></span>
            <span class="d-num">${fa(n)}</span></div>`).join("")}</div>
      </div>

      ${DASH.note ? `<div class="d-note">${esc(DASH.note)}</div>` : ""}
      <div class="d-foot">اعداد این صفحه نمونه‌اند. روی نسخه‌ی واقعی، از رفتار همین مشتری‌ها ساخته می‌شوند.</div>
    </div>
  </div>`;

  // the numbers climb to their value, and the bars grow, once — the eye follows the shape of the day
  const run = () => { const w = host.querySelector(".d-wrap"); if (w) w.classList.add("in"); };
  requestAnimationFrame(run);
  setTimeout(run, 60);                 // a covered web view has no frames; the bars still have to grow
  host.querySelectorAll(".d-stat b").forEach((el) => {
    const to = Number(el.dataset.to) || 0, t0 = performance.now();
    let done = false;
    const land = () => { done = true; el.textContent = fa(to); };
    const tick = (now) => {
      if (done) return;
      const k = Math.min(1, (now - t0) / 900);
      if (k >= 1) return land();
      el.textContent = fa(Math.round(to * (1 - Math.pow(1 - k, 3))));
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    setTimeout(land, 980);                 // whatever happens, the number on screen is the right one
  });

  const stop = () => { host.innerHTML = ""; host.classList.remove("d-on"); if (onClose) onClose(); };
  host.addEventListener("click", (e) => { if (e.target.closest(".d-close")) stop(); });
  host.classList.add("d-on");
  return { stop };
}
/* ── the wheel of fortune ─────────────────────────────────────────────────────────────────────────────────────
   The oldest trick in retail, and still the one that brings people back: one spin a day, a real prize, and a code
   the business honours. It is here because a customer who opens the app for a spin sees the menu on the way.

   The app supplies WHEEL = { title, note, prizes: [{t, w, code}] } where `w` is how often that slice should come
   up (a weight, not a percentage) and an empty `code` means «nothing this time» — a wheel that always pays is not
   believed, and a business cannot afford one.

   How it is honest: the prize is drawn first, by weight, and the wheel is then turned so that slice lands under
   the pointer. The drawing is the truth; the animation only shows it. One spin a day per phone, remembered in
   localStorage — on the real version the bot remembers it per customer, which is what stops a second phone. */

function startWheel(host, WHEEL, onClose) {
  const fa = (n) => String(n).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
  const list = (WHEEL.prizes || []).slice(0, 8);
  const N = list.length;
  const key = "wheel:" + (WHEEL.key || "demo");
  const today = new Date().toISOString().slice(0, 10);

  const saved = (() => {
    try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; }
  })();
  const spentToday = saved && saved.day === today;

  /* The slices, as one conic gradient, and the labels standing on them. */
  const step = 360 / N;
  const stops = list.map((p, i) =>
    `var(--w${i % 2 ? 2 : 1}) ${(i * step).toFixed(2)}deg ${((i + 1) * step).toFixed(2)}deg`).join(", ");
  const labels = list.map((p, i) =>
    `<span class="w-lab" style="--a:${(i * step + step / 2).toFixed(2)}deg"><b>${esc(p.t)}</b></span>`).join("");

  host.innerHTML = `<div class="w-wrap">
    <div class="w-bar"><button class="w-close" type="button" aria-label="بستن">✕</button>
      <div><span class="w-eyebrow">lucky wheel</span><b>${esc(WHEEL.title || "گردونه‌ی شانس")}</b></div></div>
    <div class="w-stage">
      <div class="w-pin"></div>
      <div class="w-disc" id="w-disc" style="background:conic-gradient(${stops})">${labels}<i class="w-hub"></i></div>
    </div>
    <div class="w-foot">
      <button class="w-go" id="w-go" type="button">${spentToday ? "امروز چرخیدی" : "بچرخان"}</button>
      <div class="w-note" id="w-note">${esc(WHEEL.note || "هر روز یک بار")}</div>
      <div class="w-prize" id="w-prize"></div>
    </div>
  </div>`;

  const $w = (s) => host.querySelector(s);
  const disc = $w("#w-disc"), go = $w("#w-go"), note = $w("#w-note"), out = $w("#w-prize");
  let turn = 0, spinning = false;

  const show = (p, again) => {
    out.innerHTML = p.code
      ? `<div class="w-win"><b>${esc(p.t)} 🎉</b><div class="w-code">کد: <span>${esc(p.code)}</span></div>
         <small>${again ? "همین امروز بردی؛ فردا دوباره بچرخان." : "کد را موقع خرید بگو. ربات هم برایت می‌فرستد."}</small></div>`
      : `<div class="w-win miss"><b>${esc(p.t)}</b><small>فردا دوباره شانست را امتحان کن 🌿</small></div>`;
  };

  if (spentToday && saved.prize) {
    show(saved.prize, true);
    disc.style.transform = `rotate(${saved.turn || 0}deg)`;
    go.disabled = true;
  }

  /** Draw by weight, then turn the wheel until that slice is under the pointer. */
  function spin() {
    if (spinning || go.disabled) return;
    spinning = true;
    go.disabled = true;
    note.textContent = "بچرخ…";
    const total = list.reduce((s, p) => s + (p.w || 1), 0);
    let r = Math.random() * total, i = 0;
    for (; i < N - 1; i++) {
      r -= list[i].w || 1;
      if (r <= 0) break;
    }
    const prize = list[i];
    /* The pointer is at the top (−90°). Bring the middle of slice i there, after five whole turns. */
    const middle = i * step + step / 2;
    turn += 360 * 5 + ((-90 - middle) % 360 + 360) % 360 - (turn % 360);
    disc.style.transform = `rotate(${turn}deg)`;
    setTimeout(() => {
      spinning = false;
      note.textContent = WHEEL.note || "هر روز یک بار";
      show(prize, false);
      haptic(prize.code ? "ok" : "light");
      try { localStorage.setItem(key, JSON.stringify({ day: today, prize, turn })); } catch (e) {}
    }, 4200);
  }

  const stop = () => { host.innerHTML = ""; host.classList.remove("w-on"); if (onClose) onClose(); };
  host.addEventListener("click", (e) => {
    if (e.target.closest(".w-close")) return stop();
    if (e.target.closest("#w-go")) return spin();
  });
  host.classList.add("w-on");
  return { stop, spin };
}
/* Swipe a calendar to change month (RTL: swipe right = next month). */
let swipeX = null;
document.addEventListener("touchstart", (e) => { swipeX = e.target.closest && e.target.closest(".cal") ? e.touches[0].clientX : null; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (swipeX === null) return;
  const dx = e.changedTouches[0].clientX - swipeX; swipeX = null;
  if (Math.abs(dx) < 50) return;
  const b = document.querySelector(`.cal-head [data-nav="${dx > 0 ? 1 : -1}"]`);
  if (b && !b.disabled) b.click();
}, { passive: true });
/* Inside Telegram: match the header to the page. */
if (tg) { try { const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg1").trim(); tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {} }
render();
</script>
